<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- canonical XP title-bar gradient -->
    <linearGradient id="xpBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0058ee"/>
      <stop offset="8%"   stop-color="#3c81f3"/>
      <stop offset="40%"  stop-color="#297ce5"/>
      <stop offset="88%"  stop-color="#2575e0"/>
      <stop offset="100%" stop-color="#2168cc"/>
    </linearGradient>

    <!-- proper top-half gloss: bright, with a hard horizontal break (the XP "wet plastic" look) -->
    <linearGradient id="topGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="48%"  stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="49%"  stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- soft comma-gleam in the corner -->
    <radialGradient id="cornerGleam" cx="0.25" cy="0.18" r="0.32">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- subtle drop shadow under the S so it sits ON the tile, not flat against it -->
    <filter id="sShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.7"/>
      <feOffset dx="0" dy="1.2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- main tile -->
  <rect x="1" y="1" width="62" height="62" rx="11" fill="url(#xpBlue)"/>
  <!-- top glossy half (XP signature) -->
  <rect x="1" y="1" width="62" height="62" rx="11" fill="url(#topGloss)"/>
  <!-- corner specular gleam — the "extra detail to make it shine" -->
  <rect x="1" y="1" width="62" height="62" rx="11" fill="url(#cornerGleam)"/>

  <!-- canonical XP double bevel: 1px inner white highlight + 1px outer dark border -->
  <rect x="2" y="2" width="60" height="60" rx="10"
        fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="11.5"
        fill="none" stroke="#003ca6" stroke-width="1"/>

  <!-- bold S, lifted with a soft shadow -->
  <text x="32" y="48" text-anchor="middle"
        font-family="Tahoma, Verdana, Geneva, sans-serif"
        font-size="46" font-weight="900" fill="#ffffff"
        filter="url(#sShadow)">S</text>
</svg>
